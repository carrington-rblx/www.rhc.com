<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>RHC — Welcome</title>
  <meta name="description" content="Welcome to RHC. Discover our work, services, and ways to get in touch.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--green:#176f62;--green-dark:#10594f;--navy:#123f6c;--ink:#242424;--muted:#5c6664}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);font-family:"DM Sans",Arial,sans-serif;background:#fff}
    a{color:inherit}
    .site-header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid #e5e8e7;box-shadow:0 2px 8px #00000012;position:relative;z-index:2;background:#fff}
    .brand{display:flex;align-items:center;min-width:170px}
    .brand img{display:block;width:auto;max-width:190px;max-height:48px;object-fit:contain}
    .nav{display:flex;align-items:center;gap:36px;margin-left:auto}
    .nav a{text-decoration:none;color:#075f59;font-size:18px;font-weight:500}
    .nav a:hover{text-decoration:underline;text-underline-offset:5px}
    .header-actions{height:78px;display:flex;align-items:stretch;margin-left:30px;border-left:1px solid #e1e5e4}
    .header-actions a{min-width:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#075f59;text-decoration:none;font-size:16px}
    .header-actions svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2}
    .mobile-menu{display:none;background:none;border:0;color:var(--green);font-size:28px}
    .announcement{position:absolute;top:104px;left:0;z-index:1;background:var(--navy);color:#fff;padding:20px 38px 20px max(7.6vw,32px);width:min(600px,48vw);border-radius:0 56px 56px 0;font-size:21px;font-weight:700;line-height:1.5}
    .announcement a{display:block;color:#fff;text-underline-offset:4px}
    .hero{min-height:744px;display:grid;grid-template-columns:52% 48%;align-items:center;position:relative;overflow:hidden;background:linear-gradient(100deg,#fff 0%,#fff 48%,#f5f8f7 100%);padding:132px max(7.6vw,32px) 54px}
    .hero-copy{position:relative;z-index:1;padding-bottom:6px}
    h1{font-size:clamp(64px,6.25vw,112px);line-height:1.08;letter-spacing:-.055em;margin:0 0 48px;font-weight:800}
    h1 span{display:block;color:var(--green);margin-top:12px}
    .primary-cta{display:inline-flex;align-items:center;justify-content:center;min-height:70px;padding:0 29px;border-radius:40px;background:var(--green);color:#fff;text-decoration:none;font-size:21px;font-weight:700;transition:background .2s,transform .2s}
    .primary-cta:hover{background:var(--green-dark);transform:translateY(-2px)}
    .secondary-cta{display:flex;align-items:center;gap:13px;margin-top:27px;font-size:18px;font-weight:600;text-decoration:none;width:max-content}
    .secondary-cta:hover{text-decoration:underline;text-underline-offset:5px}
    .secondary-cta svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
    .hero-visual{height:100%;min-height:480px;display:flex;align-items:flex-end;justify-content:center;position:relative}
    .hero-visual img{width:100%;height:100%;max-height:590px;object-fit:cover;object-position:center 38%;border-radius:2px 2px 0 0;mask-image:linear-gradient(to bottom,#000 90%,transparent 100%)}
    .feedback{position:fixed;right:0;top:27%;z-index:5;background:var(--green);color:#fff;text-decoration:none;font-weight:700;padding:22px 13px;border-radius:10px 0 0 10px;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.02em}
    .below{padding:72px max(7.6vw,32px);background:#fff}
    .below h2{font-size:36px;margin:0 0 14px}
    .below p{font-size:18px;color:var(--muted);max-width:680px;line-height:1.7;margin:0}
    @media(max-width:900px){.site-header{padding:0 22px}.nav{gap:18px}.nav a{font-size:15px}.header-actions{margin-left:16px}.hero{grid-template-columns:1fr 0.9fr;padding-left:5vw;padding-right:5vw}.announcement{width:55vw}.hero-visual{min-height:390px}}
    @media(max-width:650px){.site-header{height:68px}.brand img{max-width:145px;max-height:42px}.nav,.header-actions{display:none}.mobile-menu{display:block}.announcement{position:relative;top:auto;width:88%;margin-top:18px;padding:13px 24px;font-size:15px}.hero{display:flex;flex-direction:column;align-items:stretch;min-height:0;padding:58px 24px 0;gap:25px}.hero-copy{padding:0}h1{font-size:clamp(54px,13vw,76px);margin-bottom:30px}.primary-cta{min-height:58px;font-size:17px;padding:0 22px}.secondary-cta{font-size:16px;margin-top:20px}.hero-visual{min-height:300px;height:340px;margin:0 -24px}.hero-visual img{max-height:none;object-position:center 32%}.feedback{top:38%;font-size:14px;padding:16px 9px}.below{padding:52px 24px}.below h2{font-size:29px}}
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="RHC home"><img src="/rossi-primary-logo.png" alt="RHC"></a>
    <nav class="nav" aria-label="Main navigation">
      <a href="#about">About RHC⌄</a>
      <a href="#services">Our Services⌄</a>
      <a href="#contact">Contact⌄</a>
    </nav>
    <div class="header-actions">
      <a href="#contact" aria-label="Contact RHC">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-8.8 8.4 9 9 0 0 1-4-.9L3 21l1.6-4.5a8.2 8.2 0 1 1 16.4-5Z"/></svg>
        Contact
      </a>
      <a href="#contact" aria-label="Get in touch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7M21 3l-9 9M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/></svg>
        Connect
      </a>
    </div>
    <button class="mobile-menu" aria-label="Open navigation" onclick="document.querySelector('.nav').classList.toggle('mobile-open')">☰</button>
  </header>
  <div class="announcement">Welcome to RHC<a href="#about">Discover what we do</a></div>
  <main>
    <section class="hero" id="about">
      <div class="hero-copy">
        <h1>Welcome to<span>RHC</span></h1>
        <a class="primary-cta" href="#services">Explore RHC</a>
        <a class="secondary-cta" href="#contact">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.5 2.8a2 2 0 0 1-.6 1.7L7.2 10a16 16 0 0 0 6 6l1.8-1.8a2 2 0 0 1 1.7-.6l2.8.5a2 2 0 0 1 1.7 1.8Z"/></svg>
          Talk to our team
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </a>
      </div>
      <div class="hero-visual">
        <img src="https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=1200&q=85" alt="Colleagues working together">
      </div>
    </section>
    <section class="below" id="services">
      <h2>Discover RHC</h2>
      <p>Learn more about our work, explore our services, and connect with our team.</p>
    </section>
    <section class="below" id="contact">
      <h2>Talk to our team</h2>
      <p>Get in touch with RHC to learn more.</p>
    </section>
  </main>
  <a class="feedback" href="#contact">Feedback</a>
  <style>
    @media(max-width:650px){.nav.mobile-open{display:flex;position:absolute;top:68px;left:0;right:0;background:#fff;padding:18px 24px;flex-direction:column;align-items:flex-start;box-shadow:0 8px 14px #00000012;z-index:9}}
  </style>
</body>
</html>
